<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mening ro‘yxatim — anime, manga, kino</title>
<script>
  document.documentElement.dataset.theme = localStorage.getItem("mening-royxatim-theme") || "violet";
</script>
<style>
  :root{
    --bg:#0e1015;--panel:#161920;--panel2:#1d2129;--line:#2a2f3a;--line2:#3a4150;
    --text:#e9ebf1;--muted:#8a92a4;--accent:#ff5c8a;--on-accent:#1a0810;
    --done:#3ecf8e;--watching:#4da3ff;--plan:#f5b942;--dropped:#9aa2b3;
  }
  /* Rang mavzulari — ⋯ menyusidan tanlanadi */
  [data-theme=violet]{--bg:#0f0e17;--panel:#17161f;--panel2:#1f1d2a;--line:#2c2a3b;--line2:#3f3b55;--accent:#9d8cff;--on-accent:#140f33}
  [data-theme=ocean]{--bg:#0b1016;--panel:#121a22;--panel2:#19232d;--line:#24313e;--line2:#36495d;--accent:#38bdf8;--on-accent:#04202e}
  [data-theme=emerald]{--bg:#0c110f;--panel:#131a17;--panel2:#1a231f;--line:#26332d;--line2:#384a41;--accent:#34d399;--on-accent:#052417}
  [data-theme=amber]{--bg:#12100d;--panel:#1a1713;--panel2:#231f1a;--line:#332d25;--line2:#4a4135;--accent:#ffa94d;--on-accent:#2a1500}
  [data-theme=rose]{--accent:#ff5c8a;--on-accent:#1a0810}
  [data-theme=light]{--bg:#f4f3f8;--panel:#ffffff;--panel2:#eeedf4;--line:#dddbe7;--line2:#c4c1d4;--text:#1b1a24;--muted:#5f5c70;--accent:#6d5ce8;--on-accent:#ffffff;
    --done:#15925f;--watching:#1f6fd1;--plan:#a86b00;--dropped:#6b7180}
  [data-theme=light] .r-hi{color:#b07800}
  [data-theme=light] .btn.danger{color:#c62828}
  [data-theme=light] .badge,[data-theme=light] .sbadge{background:#fffffff0}
  [data-theme=light] dialog::backdrop{background:#0006}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  img{display:block}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 110px}

  /* ---------- Sarlavha ---------- */
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  header h1{flex:1;margin:0;font-size:clamp(20px,5.5vw,26px);letter-spacing:-.01em;white-space:nowrap}
  header h1 span{color:var(--accent)}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap;min-height:40px}
  .btn:hover{border-color:var(--line2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .btn.danger{color:#ff7b7b}
  .btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
  .menu{position:relative}
  .menu-list{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;width:min(250px,calc(100vw - 32px));z-index:20;display:none;box-shadow:0 12px 30px #0008}
  .menu.open .menu-list{display:block}
  .menu-list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer}
  .menu-list button .ic{width:18px;height:18px;flex:none;color:var(--muted)}
  .ic{flex:none}
  .btn.sm .ic{width:16px;height:16px;vertical-align:-3px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes shimmer{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.drop.loading::before,.find[aria-busy=true] .ic,.sug-load .sk{animation-duration:2.4s}}
  .menu-list button:hover{background:var(--line)}
  .menu-list .note{margin:6px 12px 4px;font-size:12px;color:var(--muted);line-height:1.4}
  .themes{display:flex;align-items:center;gap:6px;padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;flex-wrap:wrap}
  .themes .lbl{font-size:13px;color:var(--muted);margin:0 6px 0 0;width:100%}
  .menu-list .sw{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid transparent;background:var(--c);display:block;flex:none}
  .menu-list .sw:hover{background:var(--c);transform:scale(1.08)}
  .menu-list .sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--panel2) inset}
  .fab{display:none}
  svg{flex:none}
  .btn svg{vertical-align:-5px}

  /* ---------- Statistika ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;min-width:0}
  .stat.active{border-color:var(--accent)}
  .stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .stat small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .stat .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .stat.static{cursor:default}

  .dist{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:14px;display:flex;align-items:flex-end;gap:4px;height:90px}
  .dist .lbl{color:var(--muted);font-size:12px;align-self:center;margin-right:8px;width:70px;flex:none}
  .bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;height:100%;justify-content:flex-end;background:none;border:0;padding:0}
  .bar i{display:block;width:100%;max-width:38px;height:calc(var(--p) * 46px);background:var(--line);border-radius:5px 5px 2px 2px;min-height:2px}
  .bar.active i,.bar:hover i{background:var(--accent)}
  .bar span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- Asboblar paneli ---------- */
  .toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:10px}
  .field{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;width:100%;min-width:0}
  .field:focus{outline:none;border-color:var(--accent)}
  .views{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
  .views button{background:none;border:0;border-radius:7px;padding:0 12px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
  .views button.on{background:var(--panel2);color:var(--text)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chips:empty{display:none}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
  .chip.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .count{color:var(--muted);font-size:13px;margin:0 0 8px 2px}
  .clear{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline}
  .stats-btn,.sort-btn,#tabs,.avg-line{display:none}
  .hint{color:var(--muted);font-size:12px}

  /* ---------- Ro‘yxat ko‘rinishi ---------- */
  .list{display:flex;flex-direction:column;gap:6px}
  .row{display:grid;grid-template-columns:28px 42px minmax(0,1fr) auto auto 52px;grid-template-areas:"num img t tag st rate";gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
  .row:hover,.row:focus-visible{border-color:var(--line2);outline:none}
  .row.dragover,.card.dragover .poster{outline:2px dashed var(--accent);outline-offset:2px}
  .num{grid-area:num;color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
  .thumb{grid-area:img;width:42px;height:60px;border-radius:7px;overflow:hidden}
  .t{grid-area:t;min-width:0}
  .t .uz{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn[aria-disabled=true]{opacity:.55}
  .t .orig{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t .note{color:var(--muted);font-size:12px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{grid-area:tag;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .meta{display:contents}
  .go{display:none}
  .inline{display:flex;gap:8px}
  .plus1{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;cursor:pointer}
  .status{grid-area:st;justify-self:start;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center}
  .status span{display:block;font-size:12px;border-radius:999px;padding:4px 10px;font-weight:600}
  .status:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:999px}
  .s-done span{background:color-mix(in srgb,var(--done) 16%,transparent);color:var(--done)}
  .s-watching span{background:color-mix(in srgb,var(--watching) 16%,transparent);color:var(--watching)}
  .s-plan span{background:color-mix(in srgb,var(--plan) 16%,transparent);color:var(--plan)}
  .s-dropped span{background:color-mix(in srgb,var(--dropped) 16%,transparent);color:var(--dropped)}
  .rate{grid-area:rate;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .rate small{color:var(--muted);font-weight:400}
  .r-hi{color:#ffd166}.r-mid{color:var(--text)}.r-lo{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px 0}

  /* Rasm yo‘q bo‘lsa — rangli o‘rinbosar */
  .ph{width:100%;height:100%;display:grid;place-items:center;font-weight:700;color:#fff;
      background:linear-gradient(150deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 40) 50% 20%));text-shadow:0 1px 3px #0006}
  .thumb .ph{font-size:14px}
  .cover{width:100%;height:100%;object-fit:cover}

  /* ---------- Poster ko‘rinishi ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 14px}
  .card{cursor:pointer;min-width:0;outline:none}
  .poster{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
  .card:hover .poster,.card:focus-visible .poster{border-color:var(--line2);transform:translateY(-2px)}
  .poster{transition:transform .15s}
  .poster .ph{font-size:28px}
  .badge{position:absolute;top:6px;right:6px;background:#000c;border-radius:8px;padding:2px 7px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
  .sbadge{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:#000c}
  .card .name{font-size:14px;font-weight:600;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- Qo‘shish / tahrirlash oynasi ---------- */
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:0;width:min(660px,94vw);max-width:none;max-height:92dvh;overflow:hidden}
  dialog::backdrop{background:#000b}
  .sheet{display:flex;flex-direction:column;max-height:92dvh}
  .sheet-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px 20px}
  .sheet-head h2{margin:0;font-size:18px;flex:1}
  .x{width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}
  .x:hover{background:var(--line);color:var(--text)}
  .sheet-body{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 20px 18px;display:grid;grid-template-columns:160px minmax(0,1fr);gap:18px;overscroll-behavior:contain}
  .sheet-foot{display:flex;gap:8px;align-items:center;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .sheet-foot .sp{flex:1}
  .fields{display:grid;gap:14px;align-content:start;min-width:0}
  .lbl{font-size:13px;color:var(--muted);margin-bottom:6px;display:block}

  .media{display:flex;flex-direction:column;gap:8px}
  .drop{position:relative;aspect-ratio:2/3;border:2px dashed var(--line2);border-radius:12px;overflow:hidden;display:grid;place-items:center;cursor:pointer;background:var(--panel2);text-align:center;color:var(--muted);font-size:13px;padding:0}
  .drop:hover,.drop.over,.drop:focus-visible{border-color:var(--accent);color:var(--text);outline:none}
  .drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .drop .big{font-size:30px;display:block;margin-bottom:4px}
  .drop small{display:block;font-size:11px;margin-top:4px;padding:0 8px}
  .drop.loading::after{content:"Yuklanmoqda…";position:absolute;inset:0;display:grid;place-items:center;padding-top:64px;background:#000a;color:#fff;z-index:1}
  .drop.loading::before{content:"";position:absolute;top:calc(50% - 30px);left:calc(50% - 18px);width:36px;height:36px;border-radius:50%;border:3px solid #fff4;border-top-color:#fff;animation:spin .8s linear infinite;z-index:2}
  .media-acts{display:flex;gap:6px;flex-wrap:wrap}
  .media-acts .btn{flex:1}
  .urlbox{display:none;gap:6px}
  .urlbox.on{display:flex}

  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt span{display:inline-block;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
  .opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
  .opt.st input:checked+span{background:var(--c);border-color:var(--c);color:var(--bg)}
  .stars{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
  .stars button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
  .stars button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .dup{font-size:13px;color:var(--plan);margin-top:6px}
  .find{margin-top:8px;font-size:13px;min-height:44px}
  #sugg{display:grid;gap:6px;margin-top:8px}
  .sug-load{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}
  .sug-load .sk{width:40px;height:60px;flex:none;border-radius:6px;background:linear-gradient(90deg,var(--panel) 0,var(--line) 50%,var(--panel) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
  .find[aria-busy=true]{pointer-events:none;opacity:.8}
  .find[aria-busy=true] .ic{animation:spin .8s linear infinite}
  #sugg[hidden]{display:none}
  .sug{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 10px;text-align:left;font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;cursor:pointer}
  .sug:hover{border-color:var(--line2)}
  .sug img{width:40px;height:60px;flex:none;object-fit:cover;border-radius:6px;background:var(--panel)}
  .sug .tx{min-width:0;flex:1}
  .sug b,.sug small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sug b{font-size:15px;font-weight:600}
  .sug small{font-size:13px;color:var(--muted,inherit);opacity:.8}
  .dup button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none}
  details summary::before{content:"▸ "}
  details[open] summary::before{content:"▾ "}
  details[open] summary{margin-bottom:10px}
  details .fields{gap:10px}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .toast.act{display:flex;align-items:center;gap:12px;padding-right:6px;width:max-content}
  .toast.act.show{pointer-events:auto}
  .toast button{flex:none;background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;min-height:44px;min-width:44px;padding:0 12px;white-space:nowrap}

  /* ---------- Tasdiqlash oynasi (askSheet) ---------- */
  #ask{width:min(360px,94vw);padding:18px 16px calc(14px + env(safe-area-inset-bottom))}
  #ask h2{margin:0 0 6px;font-size:18px}
  #ask p{margin:0 0 12px;color:var(--muted);font-size:13px}
  #ask .ask-opts{display:flex;flex-direction:column;gap:8px}
  #ask .ask-opts button{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:10px 14px;text-align:left;font-size:15px;white-space:normal;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);cursor:pointer}
  #ask .ask-opts button:hover{border-color:var(--line2)}
  #ask .ask-opts button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  #ask .ask-opts button.danger{color:#ff7b7b}
  [data-theme=light] #ask .ask-opts button.danger{color:#c62828}
  #ask .ask-opts button[aria-current=true]{border-color:var(--accent);font-weight:600}
  #ask .ask-opts button[aria-current=true]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  #ask .ask-cancel{margin-top:8px;width:100%;min-height:48px}

  /* ---------- Sahifa va ulashish ---------- */
  #page{width:min(720px,100vw);height:min(92dvh,900px);max-height:none;display:none;flex-direction:column}
  #page[open]{display:flex}
  #page .page-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line);flex:none}
  #page .page-head h2{margin:0;font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #pageClose{width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:0;color:var(--text);font-size:20px;line-height:1;cursor:pointer;border-radius:10px}
  #pageBody{flex:1;min-height:0;overflow-y:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
  .ychips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
  .ychips button{flex:none;min-width:64px;min-height:44px;padding:0 16px;font-size:15px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;color:var(--text);cursor:pointer;font-variant-numeric:tabular-nums}
  .ychips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .share-prev{display:flex;justify-content:center;margin-bottom:14px}
  .share-prev img{display:block;max-width:100%;max-height:60dvh;width:auto;height:auto;border-radius:12px;border:1px solid var(--line)}
  .share-load{text-align:center;color:var(--muted);font-size:13px;padding:24px 0}
  .share-btns{display:flex;gap:10px;flex-wrap:wrap}
  .share-btns .btn{flex:1;min-width:140px;min-height:48px;font-size:15px;text-decoration:none;color:var(--text);display:grid;place-items:center}
  .share-btns .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  /* ---------- Do‘st bilan solishtirish ---------- */
  .menu-list button[hidden]{display:none}
  .cmp-sum{font-size:15px;margin:0 0 12px}
  .cmp-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .cmp-tabs button{flex:1 1 auto;min-height:44px;padding:0 12px;font-size:13px;white-space:nowrap;background:var(--panel2);border:1px solid var(--line);border-radius:999px;color:var(--text);cursor:pointer}
  .cmp-tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .cmp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--line)}
  .cmp-row .t{min-width:0;flex:1}
  .cmp-row .n{font-size:15px;overflow-wrap:anywhere}
  .cmp-row .m{font-size:13px;color:var(--muted)}
  .cmp-add{flex:none;min-width:44px;min-height:44px;padding:0 12px;font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);cursor:pointer}
  .cmp-add[aria-disabled=true]{opacity:.6;cursor:default}
  .cmp-empty{color:var(--muted);font-size:13px;padding:16px 0;text-align:center}
  /* ---------- Tier-list ---------- */
  .tbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tbar .btn{min-height:44px;font-size:15px}

  .tposter{flex:none;width:56px;height:84px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--panel);position:relative}
  .tposter .cover,.tposter .ph{width:100%;height:100%;display:grid;place-items:center;object-fit:cover;font-size:15px;font-weight:700;color:#fffc;background:linear-gradient(135deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 40) 55% 22%))}
  .tposter[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--bg)}
  .tpool-h{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;margin:12px 0 6px;padding:0 12px;font-size:15px;font-weight:600;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;cursor:pointer}
  .tpool-h small{font-size:13px;color:var(--muted);font-weight:400}
  .tpool{margin-bottom:14px}
  .tpool:empty::before{content:"Hammasi joylangan";color:var(--muted);font-size:13px;padding:8px}
  .thint{margin:0 0 10px;color:var(--muted);font-size:13px}
  .tposter{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .tposter img{pointer-events:none;-webkit-user-drag:none}
  .tposter.tsrc{opacity:.35}
  .tghost{position:fixed;left:0;top:0;z-index:50;width:56px;height:84px;border-radius:8px;overflow:hidden;pointer-events:none;box-shadow:0 10px 24px #0009;transform:translate(-50%,-60%) scale(1.12)}
  .tghost .cover,.tghost .ph{width:100%;height:100%;display:grid;place-items:center;object-fit:cover;font-size:15px;font-weight:700;color:#fffc;background:linear-gradient(135deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 40) 55% 22%))}

  /* ---------- Planshet ---------- */
  @media (max-width:860px){
    .row{grid-template-columns:42px minmax(0,1fr) auto 52px;grid-template-areas:"img t st rate"}

  @media (max-width:640px){
    .wrap{padding:14px 12px 110px}

    .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:30px;line-height:1;border:0;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 40%,transparent);z-index:30;cursor:pointer}
    .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
    header{margin-bottom:10px;gap:8px}
    header h1{min-width:0}
    header .btn{min-height:44px;min-width:44px;padding:0 10px}
    .stats-btn{display:block;min-height:44px;min-width:44px;padding:0 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:15px;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums}
    .stats-btn[aria-expanded=true]{border-color:var(--accent);color:var(--text)}
    #overview:not(.open){display:none}
    #overview{margin-bottom:10px}
    #stats{display:none}
    .avg-line{display:block;margin:0 0 8px 2px;color:var(--muted);font-size:13px}
    .dist{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,44px);grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;height:auto;margin-bottom:0;padding:4px 12px}
    .bar{display:grid;grid-template-columns:20px minmax(0,1fr) 24px;grid-template-areas:"n t c";align-items:center;gap:6px;height:44px;text-align:left}
    .bar span{font-size:12px}
    .bar span:first-child{grid-area:c;text-align:right}

    #tabs{display:flex;position:sticky;top:0;z-index:10;background:var(--bg);overflow-x:auto;scrollbar-width:none;margin:0 -12px 4px;padding:0 12px;gap:4px}
    #tabs::-webkit-scrollbar{display:none}
    #tabs button{flex:none;min-height:44px;padding:0 12px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:15px;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums}
    #tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}

    .sort-btn{display:grid;place-items:center;width:44px;min-height:44px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);cursor:pointer;padding:0}
    #sort{display:none}
    .views button{min-width:44px;min-height:44px;padding:0 8px;font-size:16px}
    .views .vt{display:none}
    .count:not(.has-f){display:none}
    .count{display:flex;align-items:center;flex-wrap:wrap;gap:0 6px;margin:0 0 4px 2px}
    .clear{min-height:44px;min-width:44px;padding:0 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;text-decoration:none;font-size:15px}
    .empty .clear{margin-top:12px}
    #ask{width:100vw;margin:auto 0 0;border-radius:18px 18px 0 0;border-bottom:0}
    .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
    .stat b{font-size:19px}
    .stat small{font-size:12px}
    .dist .lbl{display:none}
    .toolbar{grid-template-columns:minmax(0,1fr) auto auto;margin-bottom:8px}
    .toolbar .field{min-height:44px}
    .row{grid-template-columns:42px minmax(0,1fr) 20px;grid-template-areas:"img t go" "img meta go";row-gap:2px;padding:8px 10px}
    .meta{grid-area:meta;display:flex;align-items:center;gap:10px;min-width:0}
    .meta .status{min-height:44px;display:flex;align-items:center}
    .meta .rate{text-align:left}
    .go{grid-area:go;display:grid;place-items:center;color:var(--muted)}
    .row:has(.plus1){grid-template-columns:42px minmax(0,1fr) auto}
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
    .card .sub{display:none}
    .poster .ph{font-size:20px}
    .badge{font-size:11px;padding:1px 5px}
    .sbadge{display:none}

    dialog{width:100vw;max-height:94dvh;margin:auto 0 0;border-radius:18px 18px 0 0;border-bottom:0}
    .sheet{max-height:94dvh}
    .sheet-body{grid-template-columns:1fr;padding:4px 16px 16px;gap:14px}
    .sheet-foot{padding-left:16px;padding-right:16px}
    .media{flex-direction:row;align-items:stretch}
    .drop{width:96px;flex:none}
    .drop small{display:none}
    .media-acts{flex-direction:column;flex:1}
    .media-acts .btn{flex:none}
    .stars{grid-template-columns:repeat(5,1fr)}
    .stars button{height:44px;font-size:15px}
    .menu-list{width:min(320px,calc(100vw - 24px))}
    .menu-list .sw{width:44px;height:44px}
    .menu-list button{min-height:44px}
    details summary{min-height:44px;display:flex;align-items:center}
    .x{width:44px;height:44px}
    .btn,.btn.sm{min-height:44px}
    .opt span{min-height:44px;display:inline-flex;align-items:center}
    .views button{width:44px;height:44px}
    .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px 4px;padding:0 12px}
    .chips::-webkit-scrollbar{display:none}
    .chip{min-height:44px;flex:none;white-space:nowrap}
    .field{min-height:44px}
    #statsBtn,#sortBtn,#urlOk{min-height:44px;min-width:44px}
    /* Shrift shkalasi: 12 / 13 / 15 / 16 / 20 */
    body{font-size:15px}
    input,select,textarea{font-size:16px}
    header h1,.sheet-head h2,#ask h2,.stat b,.poster .ph{font-size:20px}
    .thumb .ph,.t .orig,.t .note,.card .name,.count,.avg-line,.lbl,.themes .lbl,.chip,.opt span,.drop,.dup,details summary,.btn.sm,#ask p,.views button,.menu-list button{font-size:13px}
    .badge,.hint,.stat small,.bar span,.status span,.drop small{font-size:12px}
    .fab,.x{font-size:15px}
    .drop .big{font-size:13px}
    .t .uz{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:0s !important;animation-duration:0s !important;scroll-behavior:auto !important}
    .card:hover .poster{transform:none}
  }
</style>

<body>
<div class="wrap">
  <header>
    <h1>Mening <span>ro‘yxatim</span></h1>
    <button class="stats-btn" id="statsBtn" aria-expanded="false" aria-controls="overview" aria-label="Statistika">⌀ —</button>
    <button class="btn primary" id="addBtn" title="Yangi qo‘shish (N)"><i data-icon="plus"></i> Qo‘shish</button>
    <div class="menu" id="menu">
      <button class="btn" id="menuBtn" aria-label="Boshqa amallar"><i data-icon="menu"></i></button>
      <div class="menu-list">
        <div class="themes" id="themes">
          <span class="lbl">Rang</span>
          <button class="sw" data-theme-pick="violet" style="--c:#9d8cff" aria-label="Binafsha" title="Binafsha"></button>
          <button class="sw" data-theme-pick="ocean" style="--c:#38bdf8" aria-label="Moviy" title="Moviy"></button>
          <button class="sw" data-theme-pick="emerald" style="--c:#34d399" aria-label="Zumrad" title="Zumrad"></button>
          <button class="sw" data-theme-pick="amber" style="--c:#ffa94d" aria-label="Olovrang" title="Olovrang"></button>
          <button class="sw" data-theme-pick="rose" style="--c:#ff5c8a" aria-label="Pushti" title="Pushti"></button>
          <button class="sw" data-theme-pick="light" style="--c:linear-gradient(135deg,#fff 50%,#6d5ce8 50%)" aria-label="Yorug‘" title="Yorug‘ (oq fon)"></button>
        </div>
        <button data-act="year"><i data-icon="year"></i>Mening yilim — rasm</button>
        <button data-act="tier"><i data-icon="tier"></i>Tier-list</button>
        <button data-act="copy"><i data-icon="copy"></i>Matn ko‘rinishida nusxalash</button>
        <button data-act="export"><i data-icon="download"></i>Zaxira faylni yuklab olish (rasmlar bilan)</button>
        <button data-act="shareBackup" hidden><i data-icon="share"></i>Zaxira faylni ulashish (Telegram…)</button>
        <button data-act="compare"><i data-icon="users"></i>Do‘st bilan solishtirish</button>
        <button data-act="import"><i data-icon="upload"></i>Zaxira fayldan yangilash / tiklash</button>
        <button data-act="reset"><i data-icon="reset"></i>Boshlang‘ich ro‘yxatga qaytarish</button>
        <p class="note">Ma’lumot faqat shu qurilmadagi brauzerda saqlanadi. Boshqa qurilmaga o‘tkazish uchun zaxira fayl oling.</p>
      </div>
    </div>
    <input type="file" id="fileIn" accept="application/json,.json" hidden>
    <input type="file" id="friendIn" accept="application/json,.json" hidden>
  </header>

  <section id="overview">
    <p class="avg-line" id="avgLine"></p>
    <section class="stats" id="stats"></section>
    <section class="dist" id="dist"></section>
  </section>

  <div class="toolbar">
    <input type="search" class="field" id="q" placeholder="Qidirish…" title="Tezkor tugma: /" enterkeyhint="search">
    <select class="field" id="sort" aria-label="Saralash">
      <option value="order">Ro‘yxat tartibida</option>
      <option value="rating">Baho: yuqoridan</option>
      <option value="ratingAsc">Baho: pastdan</option>
      <option value="name">Nomi (A–Z)</option>
      <option value="recent">Oxirgi o‘zgargan</option>
    </select>
    <button class="sort-btn" id="sortBtn" aria-label="Saralash"><i data-icon="sort"></i></button>
    <div class="views" id="views">
      <button data-view="list" aria-label="Ro‘yxat ko‘rinishi"><i data-icon="list"></i><span class="vt"> Ro‘yxat</span></button>
      <button data-view="grid" aria-label="Poster ko‘rinishi"><i data-icon="grid"></i><span class="vt"> Poster</span></button>
    </div>
  </div>
  <nav id="tabs" role="tablist" aria-label="Holat"></nav>
  <div class="chips" id="types"></div>

  <p class="count" id="count"></p>
  <div id="list"></div>
</div>

<button class="fab" id="fab" aria-label="Yangi qo‘shish"><i data-icon="plus"></i></button>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="sheet" id="form" novalidate>
    <div class="sheet-head">
      <h2 id="dlgTitle">Yangi qo‘shish</h2>
      <button type="button" class="x" id="closeBtn" aria-label="Yopish"><i data-icon="close"></i></button>
    </div>

    <div class="sheet-body">
      <div class="media">
        <button type="button" class="drop" id="drop" aria-label="Rasm qo‘shish">
          <img id="prev" alt="" hidden>
          <span id="dropHint"><span class="big"><i data-icon="image"></i></span>Rasm qo‘shish<small>bosing, sudrab tashlang yoki Ctrl+V</small></span>
        </button>
        <div class="media-acts">
          <button type="button" class="btn sm" id="urlBtn"><i data-icon="link"></i> Havola</button>
          <button type="button" class="btn sm danger" id="rmImg" hidden><i data-icon="trash"></i> Olib tashlash</button>
        </div>
        <div class="urlbox" id="urlBox">
          <input class="field" id="urlIn" type="url" placeholder="https://…rasm.jpg" inputmode="url">
          <button type="button" class="btn sm" id="urlOk">OK</button>
        </div>
        <input type="file" id="imgIn" accept="image/*" hidden>
      </div>

      <div class="fields">
        <div>
          <label class="lbl" for="fUz">Nomi *</label>
          <input class="field" id="fUz" name="uz" autocomplete="off" placeholder="masalan: Naruto" enterkeyhint="done">
          <div class="dup" id="dup" hidden></div>
          <button type="button" class="btn find" id="findBtn"><i data-icon="search"></i> Internetdan topish</button>
          <div id="sugg" role="listbox" aria-label="Internetdan topilgan natijalar" hidden></div>
        </div>

        <div>
          <span class="lbl">Holati</span>
          <div class="opts" id="stOpts"></div>
        </div>

        <div>
          <span class="lbl">Baho <span class="hint" id="rateHint"></span></span>
          <div class="stars" id="stars"></div>
        </div>

        <div>
          <span class="lbl">Turi</span>
          <div class="opts" id="typeOpts"></div>
        </div>

        <details id="more">
          <summary>Qo‘shimcha: asl nomi, qayerda to‘xtadim, izoh</summary>
          <div class="fields">
            <div>
              <label class="lbl" for="fTitle">Asl nomi (inglizcha / yaponcha)</label>
              <input class="field" id="fTitle" name="title" autocomplete="off">
            </div>
            <div>
              <label class="lbl" for="fProg">Qayerda to‘xtadim</label>
              <div class="inline"><input class="field" id="fProg" name="progress" placeholder="masalan: 2-fasl, 14-qism" autocomplete="off"><button type="button" class="btn" id="progPlus" aria-label="Keyingi qism">+1</button></div>
            </div>
            <div>
              <label class="lbl" for="fTotal">Jami qismlar (bob)</label>
              <input class="field" id="fTotal" name="total" inputmode="numeric" placeholder="masalan: 24" autocomplete="off">
            </div>
            <div>
              <label class="lbl" for="fNote">Izoh</label>
              <textarea class="field" id="fNote" name="note" rows="2"></textarea>
            </div>
          </div>
        </details>
      </div>
    </div>

    <div class="sheet-foot">
      <button type="button" class="btn danger" id="delBtn"><i data-icon="trash"></i> O‘chirish</button>
      <span class="sp"></span>
      <button type="button" class="btn" id="againBtn" title="Saqlab, keyingisini qo‘shish">Saqlash va yana +</button>
      <button type="submit" class="btn primary"><i data-icon="check"></i> Saqlash</button>
    </div>
  </form>
</dialog>

<dialog id="ask" aria-labelledby="askTitle"></dialog>
<dialog id="page" aria-labelledby="pageTitle">
  <div class="page-head"><h2 id="pageTitle"></h2><button type="button" id="pageClose" aria-label="Yopish"><i data-icon="close"></i></button></div>
  <div id="pageBody"></div>
</dialog>

<div class="toast" id="toast" role="status"></div>

const toCount = (v) => { const n = Math.floor(+v); return n > 0 && isFinite(n) ? n : 0; };
function normalizeItem(x, i) {
  return {
    // id IndexedDB rasm kaliti: mavjud string id aynan saqlanadi; order/updated faqat son (HTML ga tushadi)
    id: typeof x.id === "string" && x.id ? x.id : uid(), order: toCount(x.order) || i + 1, title: x.title || "", uz: x.uz,
    type: TYPES.includes(x.type) ? x.type : "Anime", status: x.status, rating: Math.min(10, Math.max(0, Math.round(+x.rating) || 0)),
    progress: x.progress || "", note: x.note || "", updated: isFinite(+x.updated) && +x.updated > 0 ? +x.updated : 0,
    doneAt: toCount(x.doneAt), total: toCount(x.total), epMin: toCount(x.epMin),
    genres: Array.isArray(x.genres) ? x.genres.filter((g) => typeof g === "string").slice(0, 6) : [],
    tier: ["S", "A", "B", "C"].includes(x.tier) ? x.tier : "",

}
function parseBackup(text) {
  const data = JSON.parse(text);
  if (!Array.isArray(data) || !data.every((x) => x && typeof x.uz === "string" && STATUS[x.status])) throw new Error("bad backup");
  return data.map((x, i) => {
    const it = normalizeItem(x, i);
    if (typeof x.img === "string" && /^(data:image\/|https?:\/\/)/.test(x.img)) it.img = x.img;
    return it;
  });
}

/* ---------- Saqlash: yozuvlar localStorage’da, rasmlar IndexedDB’da ---------- */
function store(v) {
  try { localStorage.setItem(KEY, JSON.stringify(v)); }
  catch (e) { if (!store.warned) { store.warned = true; queueMicrotask(() => toast("Brauzer xotiraga yozishga ruxsat bermadi — o‘zgarishlar saqlanmaydi. Zaxira fayl oling.", { ms: 8000 })); } }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const v = JSON.parse(raw);
      if (Array.isArray(v)) return v.filter((x) => x && typeof x === "object" && !Array.isArray(x)).map(normalizeItem);
    }
  } catch (e) {}
  // Saqlangan ma’lumot bor, lekin o‘qib bo‘lmadi: ustidan yozmaymiz, nusxasini saqlab qo‘yamiz
  let had = null;
  try { had = localStorage.getItem(KEY); } catch {}
  const s = seedItems();
  if (had) { try { localStorage.setItem(KEY + "-buzuq", had); } catch {} }
  else store(s);
  return s;
}
const DB = {
  p: null,
  open() {
    return this.p ??= new Promise((res, rej) => {
      const r = indexedDB.open("mening-royxatim", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("img");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("img", mode); const out = fn(t.objectStore("img"));
      t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error);
    });
  },
  put(k, v) { return this.tx("readwrite", (s) => { s.put(v, k); }); },
  del(k) { return this.tx("readwrite", (s) => { s.delete(k); }); },
  clear() { return this.tx("readwrite", (s) => { s.clear(); }); },
  all() {
    return this.tx("readonly", (s) => {
      const m = new Map();
      s.openCursor().onsuccess = (e) => { const c = e.target.result; if (c) { m.set(c.key, c.value); c.continue(); } };
      return m;
    });
  },
};
const IMG = new Map();

}

function toast(msg, { ms, action } = {}) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  // Ochiq modal oyna bo‘lsa toast uning ichiga ko‘chadi — aks holda oyna ortida qolib, tugmasi bosilmaydi
  const host = ["#ask", "#page", "#dlg"].map((s) => document.querySelector(s)).find((d) => d?.open) || document.body;
  if (t.parentElement !== host) host.append(t);
  t.classList.toggle("act", !!action);
  let b = null;
  if (action) {
    b = document.createElement("button"); b.type = "button"; b.textContent = action.label;
    b.addEventListener("click", () => { clearTimeout(toast._t); hide(); action.run(); });
    t.append(b);
  }
  // Yashirilganda amal tugmasi o‘chiriladi: muddat o‘tgach klaviatura bilan ham bosilmasin
  const hide = () => { t.classList.remove("show"); if (b) { b.disabled = true; setTimeout(() => b.remove(), 250); } };
  clearTimeout(toast._t); toast._t = setTimeout(hide, ms || (action ? 5000 : 1900));
}

/* ---------- Oyna qatlamlari: Android "orqaga" tugmasi oynani yopadi ----------
   Har qatlam bitta history yozuvi ({layer: chuqurlik}). closeLayer() history.back() qiladi va
   o‘sha back yetib kelganda (popstate) bajariladigan Promise qaytaradi. Back hali yetib kelmagan
   paytda ochilgan qatlam pushState’ni back’dan keyinga qoldiradi — aks holda navbatdagi back
   yangi yozuvni yeb qo‘yadi va keyingi "orqaga" ilovadan chiqarib yuboradi. */
const layers = [];        // { onBack, pushed }
let backWaits = [];       // closeLayer() kutayotgan popstate’lar
let backLanded = Promise.resolve();
function openLayer(onBack) {
  const l = { onBack, pushed: false }; layers.push(l);
  const push = () => {
    if (!layers.includes(l) || l.pushed) return; // push’dan oldin yopilgan
    l.pushed = true; history.pushState({ layer: layers.indexOf(l) + 1 }, "");
  };
  if (backWaits.length) backLanded.then(push); else push();
}
function closeLayer() { // oyna ilovaning o‘zida yopilganda: ortiqcha history yozuvi qolmasin
  const l = layers.pop();
  if (!l?.pushed) return Promise.resolve();
  const p = new Promise((resolve) => {
    const done = () => { clearTimeout(t); backWaits = backWaits.filter((f) => f !== done); resolve(); };
    const t = setTimeout(done, 500); // oldingi yozuv bo‘lmasa back hech narsa qilmaydi
    backWaits.push(done);
  });
  backLanded = p; history.back();
  return p;
}
window.addEventListener("popstate", () => {
  if (backWaits.length) { backWaits[0](); return; }
  // Foydalanuvchining "orqaga"si: history chuqurligidan yuqoridagi qatlamlarni yopamiz.
  // Kechikkan o‘z back’imiz (taymerdan keyin) chuqurlikka mos keladi va hech narsani yopmaydi.
  const depth = history.state?.layer || 0;
  while (layers.length > depth && layers.at(-1).pushed) layers.pop().onBack();
});

/* Tasdiqlash / tanlash oynasi: mobilda pastdan, desktopda markazda.
   Natija oyna yopilib, history back yetib kelgandan keyin qaytadi — keyingi oyna xavfsiz ochiladi. */
let askDone = null;
async function askSheet({ title, text, options, cancelLabel = "Bekor qilish" }) {
  if (askDone) await askDone(null, true);
  const d = $("#ask");
  d.innerHTML = `<h2 id="askTitle">${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ""}
    <div class="ask-opts">${options.map((o) => `<button type="button" data-v="${esc(o.value)}"${o.tone ? ` class="${o.tone}"` : ""}${o.current ? ' aria-current="true"' : ""}>${esc(o.label)}</button>`).join("")}</div>
    <button type="button" class="btn ask-cancel" data-cancel>${esc(cancelLabel)}</button>`;
  return new Promise((resolve) => {
    askDone = async (v, viaUI) => { askDone = null; d.close(); if (viaUI) await closeLayer(); resolve(v); };
    d.onclick = (e) => {
      const b = e.target.closest("button");
      if (b) askDone?.(b.hasAttribute("data-cancel") ? null : b.dataset.v, true);
      else if (e.target === d) askDone?.(null, true);
    };
    d.oncancel = (e) => { e.preventDefault(); askDone?.(null, true); };
    openLayer(() => askDone?.(null, false));
    d.showModal(); d.querySelector("[data-cancel]").focus();
  });
}

/* O‘chirish: o‘rnini va rasmini eslab qoladi; restore() qaytaradi */
function removeItem(it) {
  const idx = items.indexOf(it), gone = it.order, img = IMG.get(it.id);
  items = items.filter((x) => x !== it);
  items.forEach((x) => { if (x.order > gone) x.order--; });
  IMG.delete(it.id); // IndexedDB’dan faqat bekor qilish vaqti o‘tgach o‘chadi
  let undone = false, purged = false;
  setTimeout(() => {
    if (undone) return; purged = true; // shundan keyin restore() hech narsa qilmaydi
    if (!items.some((x) => x.id === it.id)) DB.del(it.id).catch(() => {}); // qayta yuklangan yozuv rasmi qolsin
  }, 5500);
  save();
  return () => {
    if (undone || purged) return; undone = true;
    items.forEach((x) => { if (x.order >= gone) x.order++; });
    items.splice(Math.min(idx, items.length), 0, it);
    if (img) IMG.set(it.id, img);
    save();
  };
}

async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return true; } catch {}
  try {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.append(ta); ta.select(); ta.setSelectionRange(0, txt.length);
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch { return false; }
}

/* ---------- Ko‘rsatish ---------- */
function filtered() {
  const q = norm(state.q);
  const out = items.filter((it) =>
    (state.type === "all" || it.type === state.type) &&
    (state.status === "all" || it.status === state.status) &&
    (!state.rating || it.rating === state.rating) &&
    (!q || norm(it.uz + " " + it.title + " " + it.note + " " + it.progress).includes(q)));
  const by = {
    order: (a, b) => a.order - b.order,
    rating: (a, b) => b.rating - a.rating || a.order - b.order,
    ratingAsc: (a, b) => a.rating - b.rating || a.order - b.order,
    name: (a, b) => (a.uz || a.title).localeCompare(b.uz || b.title, "uz"),
    recent: (a, b) => b.updated - a.updated || b.order - a.order,
  }[state.sort];
  return out.sort(by);
}

function renderStats() {
  const pool = items.filter((it) => state.type === "all" || it.type === state.type);
  const rated = pool.filter((it) => it.rating > 0 && it.status !== "plan");
  const avg = rated.length ? (rated.reduce((s, it) => s + it.rating, 0) / rated.length).toFixed(1) : "—";
  const n = (st) => pool.filter((it) => it.status === st).length;
  const tiles = [
    ["all", "Jami", pool.length, "var(--accent)"],
    ["done", STATUS.done, n("done"), STATUS_COLOR.done],
    ["watching", STATUS.watching, n("watching"), STATUS_COLOR.watching],
    ["plan", STATUS.plan, n("plan"), STATUS_COLOR.plan],
  ];
  if (n("dropped")) tiles.push(["dropped", STATUS.dropped, n("dropped"), STATUS_COLOR.dropped]);
  $("#statsBtn").textContent = "⌀ " + avg;
  $("#avgLine").textContent = "O‘rtacha baho " + avg;
  $("#stats").innerHTML = tiles.map(([k, l, v, c]) =>
    `<button class="stat ${state.status === k ? "active" : ""}" data-st="${k}"><b>${v}</b><small><span class="dot" style="background:${c}"></span>${l}</small></button>`
  ).join("") + `<div class="stat static"><b>${avg}</b><small>O‘rtacha baho</small></div>`;

  const counts = Array.from({ length: 10 }, (_, i) => pool.filter((it) => it.rating === i + 1).length);
  const max = Math.max(1, ...counts);
  $("#dist").innerHTML = `<div class="lbl">Baholar taqsimoti</div>` + counts.map((c, i) =>
    `<button class="bar ${state.rating === i + 1 ? "active" : ""}" data-r="${i + 1}" aria-label="${i + 1}/10 — ${c} ta"><span>${c || ""}</span><i style="--p:${c / max}"></i><span>${i + 1}</span></button>`
  ).join("");
}

function renderTabs() {
  const pool = items.filter((it) => state.type === "all" || it.type === state.type);
  const n = (st) => pool.filter((it) => it.status === st).length;
  const tabs = [["all", "Hammasi", pool.length], ["done", STATUS.done, n("done")], ["watching", STATUS.watching, n("watching")], ["plan", STATUS.plan, n("plan")]];
  if (n("dropped")) tabs.push(["dropped", STATUS.dropped, n("dropped")]);
  if (!tabs.some(([k]) => k === state.status)) state.status = "all";
  $("#tabs").innerHTML = tabs.map(([k, l, v]) =>
    `<button role="tab" data-st="${k}" aria-selected="${state.status === k}">${l} ${v}</button>`).join("");
  $("#tabs [aria-selected=true]").scrollIntoView({ inline: "nearest", block: "nearest" });
}

function renderTypes() {
  const present = TYPES.filter((t) => items.some((it) => it.type === t));

    `<button class="chip ${state.type === t ? "active" : ""}" data-type="${t}">${t === "all" ? "Hammasi" : t} · ${t === "all" ? items.length : items.filter((it) => it.type === t).length}</button>`
  ).join("");
}

function renderList() {
  const rows = filtered();

/* ---------- "+1 qism" ---------- */
function bumpProgress(text) {
  text = String(text ?? "");
  if (!text.trim()) return "1-qism";
  const f = text.match(/(\d+)(\s*\/\s*\d+)/);
  if (f) return text.slice(0, f.index) + (+f[1] + 1) + f[2] + text.slice(f.index + f[0].length);
  const all = [...text.matchAll(/\d+/g)];
  if (!all.length) return `${text}, 1-qism`;
  const m = all[all.length - 1];
  return text.slice(0, m.index) + (+m[0] + 1) + text.slice(m.index + m[0].length);
}
function progressNumber(text) {
  text = String(text ?? "");
  const f = text.match(/(\d+)\s*\/\s*\d+/);
  if (f) return +f[1];
  const all = text.match(/\d+/g);
  return all ? +all[all.length - 1] : 0;
}
async function plusOne(it) {
  const old = it.progress, oldUpdated = it.updated;
  it.progress = bumpProgress(old); it.updated = Date.now(); save();
  const name = it.uz || it.title;
  toast(`“${name}”: ${it.progress}`, { action: { label: "Bekor qilish", run: () => { it.progress = old; it.updated = oldUpdated; save(); } } });
  if (it.total > 0 && progressNumber(it.progress) >= it.total) {
    const v = await askSheet({ title: "Oxirgi qism!", text: "Ko‘rildi deb belgilaymi?", options: [{ value: "done", label: "Ha, Ko‘rildi", tone: "primary" }] });
    if (v !== "done") return;
    setStatus(it, "done"); save();
    toast(`“${name}” → ${STATUS.done}`, { ms: 5000, action: { label: "Baho qo‘yish", run: () => openDialog(it) } });
  }
}

/* ---------- Rasmni kichraytirish ---------- */
function loadImg(src, cors) {
  return new Promise((res, rej) => {
    const i = new Image(); if (cors) i.crossOrigin = "anonymous";
    i.onload = () => res(i); i.onerror = () => rej(new Error("load")); i.src = src;
  });
}
function compress(img) {
  const s = Math.min(1, 360 / img.naturalWidth, 540 / img.naturalHeight);
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
  const g = c.getContext("2d"); g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.8);
}
async function fileToThumb(file) {
  const u = URL.createObjectURL(file);
  try { return compress(await loadImg(u)); } finally { URL.revokeObjectURL(u); }
}
async function urlToThumb(u) {
  try { return compress(await loadImg(u, true)); }
  catch { await loadImg(u); return u; } // sayt nusxa olishga ruxsat bermasa — havolaning o‘zini saqlaymiz
}

const ANILIST = "https://graphql.anilist.co", TVMAZE = "https://api.tvmaze.com";
const ANILIST_Q = `query($search:String,$type:MediaType,$country:CountryCode,$formatIn:[MediaFormat],$formatNotIn:[MediaFormat]){Page(perPage:3){media(search:$search,type:$type,countryOfOrigin:$country,format_in:$formatIn,format_not_in:$formatNotIn,sort:SEARCH_MATCH){id title{romaji english} episodes chapters duration genres startDate{year} coverImage{large}}}}`;
const ANILIST_BY_TYPE = {
  "Anime": { type: "ANIME", formatNotIn: ["MOVIE", "MUSIC"] },
  "Kino": { type: "ANIME", formatIn: ["MOVIE"] },
  "Manga": { type: "MANGA", country: "JP" },
  "Manhva": { type: "MANGA", country: "KR" },
};
const httpsUrl = (u) => (/^https:\/\//i.test(u || "") ? u : "");
const metaSub = (parts) => parts.filter(Boolean).join(" · ");

async function searchMeta(q, type, signal) {
  try {
    if (type === "Serial") {
      const r = await fetch(`${TVMAZE}/search/shows?q=${encodeURIComponent(q)}`, { signal });
      if (!r.ok) return [];
      return (await r.json()).slice(0, 3).map(({ show: s }) => ({
        src: "tvmaze", id: s.id, title: s.name || "",
        sub: metaSub([s.premiered && s.premiered.slice(0, 4)]),
        cover: httpsUrl(s.image?.original || s.image?.medium), total: 0,
        epMin: s.averageRuntime || s.runtime || 0, genres: s.genres || [],
      }));
    }
    const v = ANILIST_BY_TYPE[type]; if (!v) return [];
    const r = await fetch(ANILIST, {
      method: "POST", signal, headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ query: ANILIST_Q, variables: { search: q, ...v } }),
    });
    if (!r.ok) return [];
    const list = (await r.json())?.data?.Page?.media || [];
    return list.slice(0, 3).map((m) => {
      const title = m.title?.english || m.title?.romaji || "", total = m.episodes || m.chapters || 0;
      return {
        src: "anilist", id: m.id, title,
        sub: metaSub([m.title?.romaji !== title && m.title?.romaji, m.startDate?.year, total && `${total} ${m.episodes ? "qism" : "bob"}`]),
        cover: httpsUrl(m.coverImage?.large), total, epMin: m.duration || 0, genres: m.genres || [],
      };
    });
  } catch { return []; } // tarmoq xatosi yoki bekor qilish
}
async function tvmazeEpisodes(id) {
  try { const r = await fetch(`${TVMAZE}/shows/${id}/episodes`); return r.ok ? (await r.json()).length : 0; }
  catch { return 0; }
}

/* Canvas’ni sahifadagi .share-out ichida ko‘rsatadi (yo‘q bo‘lsa tanaga qo‘shadi). Tugmalar blob tayyor bo‘lgach chiqadi. */
function shareCanvas(canvas, fileName, title) {
  let host = $("#pageBody .share-out");
  if (!host) { host = document.createElement("div"); host.className = "share-out"; $("#pageBody").append(host); }
  host.innerHTML = '<div class="share-load">Rasm tayyorlanmoqda…</div>';
  dropPageUrl();
  const fail = () => { if (host.isConnected) host.innerHTML = ""; toast("Rasmni tayyorlab bo‘lmadi"); };
  // toBlob brauzerda kechikishi mumkin (soniyalar), shuning uchun toDataURL → Blob
  let url;
  try { url = canvas.toDataURL("image/png"); } catch { fail(); return; } // masalan, canvas bulg‘angan
  fetch(url).then((r) => r.blob()).then((blob) => {
    if (!host.isConnected) return;
    dropPageUrl(); pageUrl = URL.createObjectURL(blob);
    const file = new File([blob], fileName, { type: "image/png" });
    host.innerHTML = '<div class="share-prev"><img alt="Ulashiladigan rasm"></div><div class="share-btns"></div>';
    host.querySelector("img").src = pageUrl;
    const btns = host.querySelector(".share-btns");
    if (navigator.canShare?.({ files: [file] })) {
      const sb = document.createElement("button"); sb.type = "button"; sb.className = "btn primary"; sb.textContent = "Ulashish";
      sb.addEventListener("click", () => { navigator.share({ files: [file], title }).catch(() => {}); });
      btns.append(sb);
    }
    const a = document.createElement("a"); a.className = "btn" + (btns.children.length ? "" : " primary");
    a.href = pageUrl; a.download = fileName; a.textContent = "Yuklab olish"; a.setAttribute("role", "button");
    btns.append(a);
  }).catch(fail);
}

/* Poster canvas’ga: faqat oldindan yuklangan data: rasm chiziladi (http rasm canvas’ni bulg‘aydi), aks holda gradient + bosh harflar */
const coverImgs = new Map(); // data: URL → decode qilingan Image
async function preloadCovers(list) {
  await Promise.all(list.map(async (it) => {
    const src = IMG.get(it.id);
    if (!src || !src.startsWith("data:") || coverImgs.has(src)) return;
    try { const im = new Image(); im.src = src; await im.decode(); coverImgs.set(src, im); } catch {}
  }));
}
function drawCover(ctx, it, x, y, w, h) {
  const im = coverImgs.get(IMG.get(it.id));
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, 20); ctx.clip();
  if (im) {
    const k = Math.max(w / im.naturalWidth, h / im.naturalHeight), dw = im.naturalWidth * k, dh = im.naturalHeight * k;
    ctx.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  } else {
    const hu = hue(it.uz || it.title), g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, `hsl(${hu} 55% 38%)`); g.addColorStop(1, `hsl(${(hu + 40) % 360} 55% 22%)`);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#fffc"; ctx.font = `700 ${Math.round(h / 4)}px system-ui,sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(initials(it.uz || it.title), x + w / 2, y + h / 2);
  }
  ctx.restore();
}
function wrapText(ctx, text, maxW, maxLines) { // canvas matni: maxLines qatorgacha, oxirgisi "…" bilan
  const words = String(text || "").split(/\s+/).filter(Boolean), lines = [];
  let cur = "";
  for (let i = 0; i < words.length; i++) {
    const t = cur ? cur + " " + words[i] : words[i];
    if (ctx.measureText(t).width <= maxW) { cur = t; continue; }
    if (cur) lines.push(cur);
    cur = words[i];
    if (lines.length === maxLines) break;
  }
  if (cur && lines.length < maxLines) lines.push(cur);
  const rest = words.join(" ").length > lines.join(" ").length;
  if (rest || lines.length > maxLines) { lines.length = Math.min(lines.length, maxLines); }
  const last = lines.length - 1;
  if (last >= 0) {
    let l = lines[last]; const cut = rest;
    while (l && (ctx.measureText(l + (cut ? "…" : "")).width > maxW)) l = l.slice(0, -1).trimEnd();
    lines[last] = l + (cut ? "…" : "");
  }
  return lines;
}

const GENRE_UZ = { Action: "Jangari", Adventure: "Sarguzasht", Comedy: "Komediya", Drama: "Drama", Fantasy: "Fantastika", Romance: "Romantika", "Sci-Fi": "Ilmiy fantastika", "Slice of Life": "Kundalik hayot", Mystery: "Sirli", Horror: "Qo‘rqinchli", Psychological: "Psixologik", Sports: "Sport", Supernatural: "G‘ayritabiiy", Thriller: "Triller", Mecha: "Mexa", Music: "Musiqa", Crime: "Jinoyat" };

function yearStats(list, year) {

const TIERS = ["S", "A", "B", "C"];

const tierRank = (r) => (r >= 10 ? "S" : r === 9 ? "A" : r >= 7 ? "B" : r >= 1 ? "C" : "");
// Tier — ko‘rinish tanlovi, ko‘rish o‘zgarishi emas: `updated` ga tegmaydi
async function drawTierCard() {
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const rows = TIERS.map((t) => [t, items.filter((it) => it.tier === t).sort((a, b) => b.rating - a.rating || a.order - b.order)]);
  await preloadCovers(rows.flatMap((r) => r[1]));
  const ctx = c.getContext("2d"), cs = getComputedStyle(document.body), v = (n) => cs.getPropertyValue(n).trim();
  const F = (wt, px) => `${wt} ${px}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  ctx.fillStyle = v("--bg"); ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = v("--text"); ctx.font = F(700, 64); ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText("Mening tier-listim", W / 2, 110);
  const top = 150, bottom = 60, gapY = 14, x0 = 40, lw = 120, gx = 16, areaW = W - x0 * 2 - lw - gx, g = 10;
  const avail = H - top - bottom - gapY * 3;
  // eng katta poster o‘lchami (150×225 dan 60×90 gacha): hamma qator sig‘adigan; qator balandligi kamida 120 (harf katagi)
  const hOf = (n, ph) => Math.max(120, Math.max(1, n) * (ph + g) - g);
  const layout = (pw) => {
    const ph = pw * 1.5, per = Math.max(1, Math.floor((areaW + g) / (pw + g)));
    const lines = rows.map((r) => Math.max(1, Math.ceil(r[1].length / per)));
    return { pw, ph, per, lines, hs: lines.map((n) => hOf(n, ph)) };
  };
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  let L = layout(60);
  for (let pw = 150; pw >= 60; pw -= 2) { const t = layout(pw); if (sum(t.hs) <= avail) { L = t; break; } }
  // 60×90 ham sig‘masa: eng uzun qatordan qator kamaytiriladi, ortig‘i "+N" belgisi bilan ko‘rsatiladi
  while (sum(L.hs) > avail) {
    let k = -1; L.hs.forEach((h, i) => { if (L.lines[i] > 1 && (k < 0 || h > L.hs[k])) k = i; });
    if (k < 0) break;
    L.lines[k]--; L.hs[k] = hOf(L.lines[k], L.ph);
  }
  const extra = Math.max(0, avail - sum(L.hs)) / 4, info = { w: W, h: H, rows: [] };
  let y = top;
  rows.forEach(([t, list], ri) => {
    const rh = L.hs[ri] + extra, cap = L.lines[ri] * L.per, over = list.length > cap, shown = over ? cap - 1 : list.length;
    ctx.fillStyle = TIER_COLOR[t]; ctx.beginPath(); ctx.roundRect(x0, y, lw, rh, 18); ctx.fill();
    ctx.fillStyle = "#1a1a1a"; ctx.font = F(800, 72); ctx.textBaseline = "middle"; ctx.fillText(t, x0 + lw / 2, y + rh / 2); ctx.textBaseline = "alphabetic";
    ctx.fillStyle = v("--panel"); ctx.beginPath(); ctx.roundRect(x0 + lw + gx, y, areaW, rh, 18); ctx.fill();
    const pos = (i) => [x0 + lw + gx + (i % L.per) * (L.pw + g), y + Math.floor(i / L.per) * (L.ph + g)];
    list.slice(0, shown).forEach((it, i) => drawCover(ctx, it, ...pos(i), L.pw, L.ph));
    if (over) {
      const [bx, by] = pos(shown);
      ctx.fillStyle = v("--panel2"); ctx.beginPath(); ctx.roundRect(bx, by, L.pw, L.ph, 20); ctx.fill();
      ctx.fillStyle = v("--text"); ctx.font = F(800, 30); ctx.textBaseline = "middle"; ctx.fillText(`+${list.length - shown}`, bx + L.pw / 2, by + L.ph / 2); ctx.textBaseline = "alphabetic";
    }
    info.rows.push({ tier: t, y, h: rh, shown, more: over ? list.length - shown : 0, bottom: y + Math.max(0, Math.ceil((shown + (over ? 1 : 0)) / L.per)) * (L.ph + g) - g });

  });
  info.footerY = H - 22; info.endY = y - gapY;

}

    endDrag(false);
    window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp); document.removeEventListener("touchmove", noScroll);
    pageDlg.removeEventListener("close", off);
  });

  body.addEventListener("click", async (e) => {
    if (skipClick) return;
    const p = e.target.closest(".tposter"), tl = e.target.closest("[data-tier]"), pool = e.target.closest("[data-pool]");
    const cell = e.target.closest("[data-drop]");
    const put = (tier) => { setTier(sel, tier); sel = null; draw(); };
    if (p) { sel = sel === p.dataset.id ? null : p.dataset.id; draw(); }
    else if (tl && sel) put(tl.dataset.tier);
    else if (pool && sel) put("");
    else if (cell && sel) put(cell.dataset.drop);
    else if (e.target.closest("[data-auto]")) {
      const placed = items.some((it) => inPool(it) && it.tier);
      const mode = placed ? await askSheet({
        title: "Avto to‘ldirish", text: "Baholar bo‘yicha: 10 → S, 9 → A, 7–8 → B, 1–6 → C.",
        options: [{ value: "empty", label: "Faqat joylanmaganlarni", tone: "primary" }, { value: "all", label: "Hammasini qaytadan joylash" }],
      }) : "empty";
      if (!mode) return;
      const done = bulk(() => {
        let n = 0;
        items.forEach((it) => {
          if (!inPool(it) || (mode === "empty" && it.tier)) return;
          const t = tierRank(it.rating);
          if ((t || mode === "all") && it.tier !== t) { it.tier = t; n++; }
        });
        return n;
      }, (n) => `${n} ta joylandi`);
      if (!done) toast(mode === "all" ? "O‘zgaradigan yozuv yo‘q" : "Joylanadigan yozuv yo‘q");
    } else if (e.target.closest("[data-clear]")) {
      if (!items.some((it) => it.tier)) return toast("Tier-list allaqachon bo‘sh");
      if (await askSheet({
        title: "Tier-list tozalansinmi?", text: "Hamma posterlar “Joylanmagan”ga qaytadi.",
        options: [{ value: "ok", label: "Ha, tozalash", tone: "danger" }],
      }) !== "ok") return;
      bulk(() => { let n = 0; items.forEach((it) => { if (it.tier) { it.tier = ""; n++; } }); return n; }, () => "Tier-list tozalandi");
    } else if (e.target.closest("[data-img]")) {
      const my = ++token, host = body.querySelector(".share-out");
      host.innerHTML = '<div class="share-load">Rasm tayyorlanmoqda…</div>';
      const canvas = await drawTierCard();
      if (my === token && body.isConnected) shareCanvas(canvas, "mening-tier-list.png", "Tier-list");
    }
  });
  draw(); openPage({ title: "Tier-list", body });
}
pageDlg.addEventListener("close", () => { if (items.some((it) => it.tier)) render(); });

/* ---------- Do‘st bilan solishtirish ---------- */
const keysOf = (it) => [...new Set([norm(it.title), norm(it.uz)].filter(Boolean))];
const typedKeys = (it) => keysOf(it).map((k) => it.type + "|" + k); // bir xil nomli Anime va Manga — boshqa-boshqa
function compareLists(mine, friend) {
  const seen = (it) => it.status !== "plan";
  const left = mine.filter(seen), used = new Set(), both = [], onlyFriend = [];
  for (const fr of friend.filter(seen)) {
    const fk = typedKeys(fr);
    const me = left.find((m) => !used.has(m) && typedKeys(m).some((k) => fk.includes(k)));
    if (me) { used.add(me); both.push({ me, fr }); } else onlyFriend.push(fr);
  }
  const rated = both.filter((p) => p.me.rating > 0 && p.fr.rating > 0);
  const match = rated.length ? Math.round(100 - rated.reduce((a, p) => a + Math.abs(p.me.rating - p.fr.rating), 0) / rated.length * 10) : null;
  onlyFriend.sort((a, b) => b.rating - a.rating);
  return { both, onlyFriend, onlyMine: left.filter((m) => !used.has(m)), match };
}
function addFriendPlan(fr, btn) {
  if (btn.getAttribute("aria-disabled") === "true") return;
  const fk = typedKeys(fr);
  if (items.some((it) => typedKeys(it).some((k) => fk.includes(k)))) { toast("Ro‘yxatingda bor"); return; }
  const it = {
    id: uid(), order: Math.max(0, ...items.map((x) => x.order)) + 1, title: fr.title, uz: fr.uz, type: fr.type,
    status: "plan", rating: 0, progress: "", note: "", updated: Date.now(),
    doneAt: 0, total: fr.total, epMin: fr.epMin, genres: fr.genres, tier: "",
  };
  if (typeof fr.img === "string" && fr.img.startsWith("data:image/")) setImage(it.id, fr.img);
  items.push(it); save();
  btn.textContent = "Qo‘shildi"; btn.setAttribute("aria-disabled", "true");
  toast(`Rejaga qo‘shildi: ${fr.uz || fr.title}`);
}
function openComparePage(friend, tab = "both") {
  const c = compareLists(items, friend);
  const name = (it) => it.uz || it.title;
  const tabs = [["both", `Ikkalamiz (${c.both.length})`], ["friend", `U ko‘rgan (${c.onlyFriend.length})`], ["mine", `Men ko‘rgan (${c.onlyMine.length})`]];
  const rows = tab === "both" ? c.both.map((p) => ({ it: p.fr, meta: `Men: ${p.me.rating || "—"} · U: ${p.fr.rating || "—"}` }))
    : tab === "friend" ? c.onlyFriend.map((it) => ({ it, meta: `U: ${it.rating || "—"}/10`, add: true }))
    : c.onlyMine.map((it) => ({ it, meta: `Men: ${it.rating || "—"}/10` }));
  const box = document.createElement("div");
  box.innerHTML = `<p class="cmp-sum">Umumiy: ${c.both.length} ta${c.match == null ? "" : ` · Did mosligi: ${c.match}%`}</p>
    <div class="cmp-tabs">${tabs.map(([k, l]) => `<button type="button" data-tab="${k}" aria-pressed="${k === tab}">${esc(l)}</button>`).join("")}</div>
    ${rows.length ? rows.map((r, i) => `<div class="cmp-row"><div class="t"><div class="n">${esc(name(r.it))}</div><div class="m">${esc(r.it.type)} · ${esc(r.meta)}</div></div>${r.add ? `<button type="button" class="cmp-add" data-i="${i}" aria-disabled="false">+ Rejaga</button>` : ""}</div>`).join("") : `<p class="cmp-empty">Bu yerda hozircha hech narsa yo‘q</p>`}`;
  box.addEventListener("click", (e) => {
    const t = e.target.closest("[data-tab]"); if (t) return openComparePage(friend, t.dataset.tab);
    const a = e.target.closest(".cmp-add"); if (a) addFriendPlan(rows[+a.dataset.i].it, a);
  });
  openPage({ title: "Do‘st bilan solishtirish", body: box });
}
$("#friendIn").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let data;
  try { data = parseBackup(await f.text()); } catch { toast("Bu fayl mos emas — do‘stingning zaxira faylini tanlang.", { ms: 5000 }); return; }

});

/* ---------- Zaxirani ulashish ---------- */
const backupJson = () => JSON.stringify(items.map((it) => (IMG.has(it.id) ? { ...it, img: IMG.get(it.id) } : it)), null, 2);
const canShareFiles = (() => { try { return !!navigator.canShare?.({ files: [new File(["x"], "x.json", { type: "application/json" })] }); } catch { return false; } })();
if (canShareFiles) $('#menu [data-act="shareBackup"]').hidden = false;

/* ---------- Menyu: nusxa, eksport, import ---------- */
$("#menuBtn").addEventListener("click", (e) => { e.stopPropagation(); $("#menu").classList.toggle("open"); });
document.addEventListener("click", () => $("#menu").classList.remove("open"));
$("#menu .menu-list").addEventListener("click", async (e) => {
  const act = e.target.dataset.act; if (!act) return;
  if (act === "copy") {
    const txt = [...items].sort((a, b) => a.order - b.order)
      .map((it, i) => `${i + 1}. ${it.title || it.uz} | ${it.uz} | ${STATUS[it.status]} | ${it.rating ? it.rating + "/10" : "—"}`).join("\n");
    toast(await copyText(txt) ? "Ro‘yxat nusxalandi" : "Nusxalab bo‘lmadi");
  }
  if (act === "export") {
    const blob = new Blob([backupJson()], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);

    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("Fayl saqlandi");

    options: [{ value: "ok", label: "Ha, qaytarish", tone: "danger" }],
  })) {

  }
});
/* Zaxira faylni mavjud ro‘yxatga qo‘shish (sof funksiya: items va IMG ga tegmaydi) */
function mergeBackup(mine, incoming) {
  const out = mine.map((m) => ({ ...m }));
  const images = new Map();
  const byId = new Map(out.map((m) => [m.id, m]));
  const tk = typedKeys;
  const byKey = new Map();
  out.forEach((m) => tk(m).forEach((k) => { if (!byKey.has(k)) byKey.set(k, []); byKey.get(k).push(m); }));
  const used = new Set();
  const taken = new Set(out.map((m) => m.id));
  let added = 0, updated = 0, kept = 0, order = out.reduce((n, m) => Math.max(n, m.order || 0), 0);
  for (const { img, ...inc } of incoming) {
    let m = byId.get(inc.id);
    if (!m || used.has(m)) m = tk(inc).flatMap((k) => byKey.get(k) || []).find((x) => !used.has(x));
    if (m) {
      used.add(m);
      if (inc.updated > m.updated) {
        // Fayldagi nusxa bo‘sh qoldirgan maydonlarda meniki qoladi (masalan, tier yangilanish vaqtini o‘zgartirmaydi)
        Object.assign(m, inc, {
          id: m.id, order: m.order,
          tier: inc.tier || m.tier, total: inc.total || m.total, epMin: inc.epMin || m.epMin,
          genres: inc.genres.length ? inc.genres : m.genres,
          doneAt: inc.doneAt || (inc.status === "done" && m.status === "done" ? m.doneAt : 0),
        }); updated++;
        if (img) images.set(m.id, img);
      } else {
        kept++;
        if (!m.tier && inc.tier) m.tier = inc.tier;
        if (img && !IMG.has(m.id)) images.set(m.id, img);
      }
      continue;
    }
    const id = taken.has(inc.id) ? uid() : inc.id;
    const it = { ...inc, id, order: ++order };
    out.push(it); taken.add(id); used.add(it); byId.set(id, it);
    if (img) images.set(id, img);
    added++;
  }
  return { items: out, images, added, updated, kept };
}
$("#fileIn").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const data = parseBackup(await f.text());
    const how = await askSheet({
      title: `${data.length} ta yozuvli zaxira fayl`,
      text: "Yangilash — ikkala qurilmadagi yozuvlar birlashadi, yangiroq o‘zgarish olinadi. Almashtirish — bu qurilmadagi ro‘yxat o‘chib, fayldagi bilan almashtiriladi.",
      options: [{ value: "merge", label: "Yangilash (birlashtirish)", tone: "primary" }, { value: "replace", label: "Almashtirish", tone: "danger" }],
    });
    if (how === "merge") {
      const r = mergeBackup(items, data);
      items = r.items; r.images.forEach((src, id) => setImage(id, src));
      save(); toast(`Yangilandi: +${r.added} yangi, ${r.updated} ta yangilandi. O‘chirilganlar ko‘chmaydi.`, { ms: 6000 });
    } else if (how === "replace") {
      IMG.clear(); await DB.clear().catch(() => {});
      items = data.map(({ img, ...it }) => { if (img) setImage(it.id, img); return it; });
      save(); toast("Yuklandi");
    }
  } catch { toast("Bu fayl mos emas — shu ilovadan olingan zaxira faylni tanlang.", { ms: 5000 }); }
});
